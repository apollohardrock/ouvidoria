{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block content %}
<div class="password-reset-wrapper">
    <h2>Recuperação de Senha</h2>
    <p>
        Esqueceu sua senha? Digite seu e-mail cadastrado abaixo e enviaremos instruções para redefinição.
    </p>

    <form action="" method="post">
        {% csrf_token %}
        <div class="password-reset-group">
            {{ form.email.errors }}
            <label for="id_email">E-mail:</label>
            {{ form.email }}
        </div>
        <button type="submit" class="btn-password-reset">
            Enviar link de redefinição
        </button>
    </form>
</div>
{% endblock %}
