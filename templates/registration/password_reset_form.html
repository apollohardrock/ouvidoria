{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto; padding: 2rem; background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);">
    <h2 style="color: #0a3153; margin-bottom: 1rem; font-size: 1.3rem;">Recuperação de Senha</h2>
    <p style="margin-bottom: 1.5rem; color: #64748b; font-size: 0.95rem;">
        Esqueceu sua senha? Digite seu e-mail cadastrado abaixo e enviaremos instruções para redefinição.
    </p>

    <form action="" method="post">
        {% csrf_token %}
        <div style="margin-bottom: 1.2rem;">
            {{ form.email.errors }}
            <label for="id_email" style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: #334155;">E-mail:</label>
            {{ form.email }}
        </div>
        <button type="submit" style="width: 100%; background-color: #f26522; color: #fff; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">
            Enviar link de redefinição
        </button>
    </form>
</div>
{% endblock %}
